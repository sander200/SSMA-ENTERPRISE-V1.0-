<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Shield Badge Contour -->
  <path d="M256 68 L390 120 C390 260 330 365 256 424 C182 365 122 260 122 120 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <path d="M256 86 L372 132 C372 250 320 345 256 398 C192 345 140 250 140 132 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.18" />

  <!-- Hard Hat / Capacete de SST -->
  <g transform="translate(0, 8)">
    <!-- Helmet Dome -->
    <path d="M176 250 C176 182 212 152 256 152 C300 152 336 182 336 250 Z" 
          fill="url(#helmetGrad)" />
    
    <!-- Helmet Rib Center -->
    <path d="M246 153 C246 153 252 200 252 250 L260 250 C260 200 266 153 266 153 Z" 
          fill="#fef3c7" 
          opacity="0.5" />

    <!-- Helmet Brim / Aba do Capacete -->
    <path d="M152 252 C152 244 164 240 256 240 C348 240 360 244 360 252 C360 262 344 266 256 266 C168 266 152 262 152 252 Z" 
          fill="#b45309" />
    <path d="M156 250 C162 245 190 242 256 242 C322 242 350 245 356 250 C348 256 318 260 256 260 C194 260 164 256 156 250 Z" 
          fill="#f59e0b" />

    <!-- Cross of Safety / Cruz Verde de SST -->
    <circle cx="256" cy="204" r="22" fill="#ffffff" />
    <path d="M251 190 H261 V218 H251 Z M242 199 H270 V209 H242 Z" fill="#059669" />
  </g>

  <!-- Pulse / ECG wave below helmet indicating mental health -->
  <path d="M190 310 L220 310 L234 290 L248 335 L264 285 L278 320 L292 310 L322 310" 
        fill="none" 
        stroke="#2dd4bf" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Typography subtitle -->
  <text x="256" y="366" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc" 
        text-anchor="middle">SSMA</text>
  <text x="256" y="388" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#14b8a6" 
        text-anchor="middle">ENTERPRISE</text>
</svg>
